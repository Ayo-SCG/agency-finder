name: Nightly SAM.gov opportunities

on:
  schedule:
    - cron: "17 9 * * *"   # every day, about 4:17 AM Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_opps.py"
      - ".github/workflows/nightly-sam.yml"

permissions:
  contents: write

concurrency:
  group: nightly-sam
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the public SAM.gov extract
        run: |
          curl -sS -L --fail --retry 3 --max-time 1200 -o opps.csv \
            "https://sam.gov/api/prod/fileextractservices/v1/api/download/Contract%20Opportunities/datagov/ContractOpportunitiesFullCSV.csv?privacy=Public"
          ls -la opps.csv
      - name: Sort open opportunities by NAICS code
        run: python3 scripts/build_opps.py opps.csv out
      - name: Publish to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "agency-finder nightly"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "SAM.gov opportunities $(date -u +%F)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
